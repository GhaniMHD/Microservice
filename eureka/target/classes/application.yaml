spring:
  application:
    name: eureka
server: 
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  logging:
    level:
      com.netflix.discovery: OFF
      com.netflix.eureka: OFF

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"

  metrics:
    tags:
      application: ${spring.application.name}

      